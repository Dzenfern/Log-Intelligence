spring:
  application:
    name: LogIntelligence
  datasource:
    url: jdbc:postgresql://localhost:5433/LogIntelligence
    username: postgres
    password: root
  
  # Hibernate dialect (auto-detected, but good to specify)
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.dylan.logintelligence.DTOs.LogResponseDTO
  # Optional: log SQL parameters (helps debugging)
  redis:
    host: localhost
    port: 6379
    password: mypassword
    database: 0
    timeout: 2000ms
    connect-timeout: 2000ms
    client-type: lettuce
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms
      shutdown-timeout: 100ms

logging:
  level:
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

server:
  port: 8090